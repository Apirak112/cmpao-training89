<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ระบบฝึกอบรม อบจ.เชียงใหม่</title>
    
    <!-- ฟอนต์ Prompt + FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1a235a, #070b2f 60%, #04061a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        /* 🌟 กล่อง Login */
        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(147, 197, 253, 0.2);
            border-radius: 25px;
            box-shadow:
                0 25px 50px rgba(0,0,0,0.5),
                inset 0 2px 5px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            position: relative;
        }

        /* 🌟 โลโก้ */
        .top-logo {
            width: 120px;
            height: 120px;
            margin: -90px auto 20px auto;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #070b2f;
            overflow: hidden !important;
            position: relative;
            cursor: pointer;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.5),
                inset 0 4px 8px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(59, 130, 246, 0.4);

            animation: floatingLogo 3.5s ease-in-out infinite;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 🌟 แสงวิ่งผ่านโลโก้ */
        .top-logo::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.8) 50%,
                rgba(255,255,255,0) 100%
            );
            transform: skewX(-25deg);
            animation: shineEffect 4s infinite;
            z-index: 2;
        }

        @keyframes floatingLogo {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
                box-shadow:
                    0 25px 40px rgba(0, 0, 0, 0.4),
                    0 0 35px rgba(59, 130, 246, 0.7);
            }
        }

        @keyframes shineEffect {
            0% {
                left: -100%;
            }

            20% {
                left: 200%;
            }

            100% {
                left: 200%;
            }
        }

        /* 🌟 Hover Logo */
        .top-logo:hover {
            transform: scale(1.15) translateY(-5px) !important;
            border-color: #3b82f6;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.6),
                0 0 50px rgba(96, 165, 250, 0.9),
                inset 0 0 15px rgba(59, 130, 246, 0.5);

            animation-play-state: paused;
        }

        .top-logo img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            padding: 2px;
            transition: transform 0.5s ease;
            z-index: 1;
        }

        .top-logo:hover img {
            transform: scale(1.08);
        }

        h1 {
            text-align: center;
            margin: 0 0 5px;
            font-size: 26px;
            font-weight: 500;
        }

        p {
            text-align: center;
            color: #94a3b8;
            margin: 0 0 30px;
            font-size: 14px;
        }

        /* 🌟 ช่องกรอกข้อมูล */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 1px solid rgba(147, 197, 253, 0.2);
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2);
        }

        .input-group input::placeholder {
            color: #94a3b8;
        }

        .input-group input:focus {
            border-color: #3b82f6;
            background: rgba(30, 41, 59, 0.8);
            box-shadow:
                0 0 15px rgba(59, 130, 246, 0.3),
                inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .input-group input:focus + i,
        .input-group input:focus ~ i {
            color: #60a5fa;
        }

        /* 🌟 ปุ่มดู/ซ่อน Password */
        .input-group .toggle-password {
            position: absolute;
            left: auto;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748b;
            pointer-events: auto !important;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .input-group .toggle-password:hover {
            color: #60a5fa;
            transform: translateY(-50%) scale(1.15);
        }

        /* 🚀 ปุ่ม Login */
        button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;

            background: linear-gradient(90deg, #1d4ed8, #3b82f6);
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1.5px;

            border: 2px solid #3b82f6;
            border-radius: 12px;
            cursor: pointer;

            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);

            transition: all 0.3s ease-in-out;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        button:hover {
            background: linear-gradient(90deg, #2563eb, #60a5fa);

            box-shadow:
                0 0 25px rgba(59, 130, 246, 0.7),
                0 0 40px rgba(59, 130, 246, 0.3);

            border-color: #60a5fa;
            transform: translateY(-2px);
        }

        button:active {
            background: #04081c;
            color: #60a5fa;
            border-color: #3b82f6;

            box-shadow:
                inset 0 0 20px rgba(59, 130, 246, 0.5),
                0 0 10px rgba(59, 130, 246, 0.2);

            text-shadow: 0 0 8px rgba(59, 130, 246, 0.8);

            transform: translateY(3px) scale(0.97);
            transition: all 0.1s;
        }

        /* 🌟 Error */
        .error {
            min-height: 24px;
            color: #fca5a5;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        /* 🌟 Note */
        .note {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            line-height: 1.8;
        }

        .note b {
            color: #e2e8f0;
        }

        /* 📱 Mobile */
        @media (max-width: 500px) {
            .login-box {
                padding: 45px 25px 30px;
                border-radius: 20px;
            }

            .top-logo {
                width: 100px;
                height: 100px;
                margin: -80px auto 20px auto;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 13px;
                margin-bottom: 25px;
            }

            .input-group input {
                font-size: 14px;
                padding: 13px 20px 13px 45px;
            }

            .input-group i {
                left: 18px;
                font-size: 1rem;
            }

            button {
                font-size: 16px;
                padding: 14px;
                margin-top: 10px;
            }

            .note {
                font-size: 12px;
                margin-top: 20px;
            }
        }

        /* 📱 จอเตี้ย */
        @media (max-height: 650px) {
            body {
                padding-top: 60px;
            }
        }
    </style>
</head>

<body>

    <main class="login-box">

        <!-- 🌟 โลโก้องค์กร -->
        <div class="top-logo">
            <img src="S__32161803.jpg" alt="โลโก้ อบจ.เชียงใหม่">
        </div>

        <h1>เข้าสู่ระบบ</h1>

        <p>
            ระบบข้อมูลการฝึกอบรม
            องค์การบริหารส่วนจังหวัดเชียงใหม่
        </p>

        <form id="loginForm">

            <!-- Username -->
            <div class="input-group">
                <input
                    id="username"
                    type="text"
                    placeholder="ชื่อผู้ใช้ (Username)"
                    autocomplete="username"
                    required
                >
                <i class="fa-solid fa-user"></i>
            </div>

            <!-- Password -->
            <div class="input-group">
                <input
                    id="password"
                    type="password"
                    placeholder="รหัสผ่าน (Password)"
                    autocomplete="current-password"
                    required
                >

                <i class="fa-solid fa-lock"></i>

                <i
                    class="fa-solid fa-eye toggle-password"
                    id="togglePassword"
                    title="แสดงรหัสผ่าน"
                ></i>
            </div>

            <button type="submit">
                เข้าสู่ระบบ
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>

            <div id="error" class="error"></div>

        </form>

    </main>


    <script>

        // =========================================================
        // 👁️ เปิด / ปิด Password
        // =========================================================

        const togglePassword =
            document.getElementById('togglePassword');

        const passwordInput =
            document.getElementById('password');

        if (togglePassword) {

            togglePassword.addEventListener('click', function () {

                const type =
                    passwordInput.getAttribute('type') === 'password'
                        ? 'text'
                        : 'password';

                passwordInput.setAttribute('type', type);

                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');

                this.title =
                    type === 'password'
                        ? 'แสดงรหัสผ่าน'
                        : 'ซ่อนรหัสผ่าน';

            });

        }


        // =========================================================
        // 🔐 ระบบ Login
        //
        // รูปแบบ
        //
        // Username = ชื่อภาษาอังกฤษ + 241
        // Password = ชื่อภาษาอังกฤษเดียวกัน
        //
        // ตัวอย่าง
        //
        // Somchai241 / Somchai
        // Somsak241  / Somsak
        // Nattapong241 / Nattapong
        //
        // =========================================================

        document
            .getElementById('loginForm')
            .addEventListener('submit', function (e) {

                e.preventDefault();

                const username =
                    document
                        .getElementById('username')
                        .value
                        .trim();

                const password =
                    document
                        .getElementById('password')
                        .value;

                const error =
                    document.getElementById('error');


                // ล้าง Error เดิม
                error.textContent = '';


                // =====================================================
                // ตรวจสอบ Username
                //
                // ต้องเป็น:
                //
                // ตัวแรก = A-Z
                // ต่อด้วยตัวอักษรภาษาอังกฤษ
                // ลงท้ายด้วย 
                //
                // เช่น
                //
                // Somchai241       ✅
                // Nattapong241     ✅
                // Apiraik241       ✅
                //
                // somchai241       ❌
                // SOMCHAI241       ❌
                // Somchai123       ❌
                //
                // =====================================================

                const usernamePattern =
                    /^([A-Z][a-zA-Z]*)241$/;


                const match =
                    username.match(usernamePattern);


               if (!match) {
    error.textContent = 'ใส่รหัสไม่ถูกต้อง';
    return;
}

                // ดึงชื่อออกจาก Username
                const nameFromUsername =
                    match[1];


                // =====================================================
                // ตรวจสอบ Password
                //
                // Password ต้องตรงกับชื่อใน Username
                //
                // Somchai241 / Somchai ✅
                //
                // Somchai241 / somchai ❌
                // Somchai241 / SOMCHAI ❌
                //
                // =====================================================

               if (password !== nameFromUsername) {
    error.textContent = 'ใส่รหัสไม่ถูกต้อง';
    return;
}


                // =====================================================
                // ✅ Login สำเร็จ
                // =====================================================

                localStorage.setItem(
                    'trainingLoggedIn',
                    'true'
                );


                // เก็บข้อมูลผู้ใช้งาน
                localStorage.setItem(
                    'trainingUser',
                    JSON.stringify({

                        username: username,

                        name: nameFromUsername,

                        role: 'employee'

                    })
                );


                // =====================================================
                // ไปหน้าเว็บไซต์หลัก
                // =====================================================

                window.location.href = 'naruk.html';

            });
            
    </script>

</body>
</html>
